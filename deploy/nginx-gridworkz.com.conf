# /etc/nginx/sites-available/gridworkz.com
# certbot --nginx adds the HTTPS (443) settings to this file.

server {
    listen 80;
    listen [::]:80;
    server_name gridworkz.com www.gridworkz.com;

    root /var/www/gridworkz.com;
    index index.html;

    # Redirect www to the bare domain
    if ($host = www.gridworkz.com) {
        return 301 $scheme://gridworkz.com$request_uri;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Astro's hashed assets never change, so cache them for a year
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Docs search index
    location /pagefind/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    error_page 404 /404.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
